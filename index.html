<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Louver | Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/user/style.css">

</head>
<body>
  <div class="left">
    <h2>WELCOME TO</h2>
    <h1>LOUVER</h1>
    <p class="tagline">Crave it. Click it. Get it.</p>

    <p class="small">Already have an account?</p>
    <a href="/Louver-FinalProject/html/user/login.html"><button class="login-btn">LOG IN</button></a>
  </div>

  <div class="right">
    <div class="shape1"></div>
    <div class="shape2"></div>

    <div class="form-box">
      <h3>CREATE AN ACCOUNT</h3>

      <form id="signup-form" method="POST" action="/Louver-FinalProject/database/signupCustomer.php">
      <input type="text" name="first_name" placeholder="First Name" required>
      <input type="text" name="last_name" placeholder="Last Name" required>
      <input type="text" name="contact_number" placeholder="Contact Number" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit" class="signup-btn">SIGN UP</button>
    </form>
    
    </div>
  </div>

  <script src="/Louver-FinalProject/js/user/script.js"></script>
</body>
</html>
