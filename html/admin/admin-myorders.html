<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders | Louver</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="../../css/admin/admin-styles.css">
<link rel="stylesheet" href="../../css/admin/admin-myorders.css">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">
                <img src="../../assets/pictures/logo.png" alt="Louver Logo" style="height:60px; width:auto;" />
        <span>LOUVER</span>
    </div>

    <div class="navbar-right">
      <nav>
        <a href="admin-homepage.html">APPLICATIONS</a>
        <a href="admin-businesses.html">BUSINESSES</a>
        <a href="admin-myorders.html" class="active">ORDERS</a>
        <a href="admin-account.html">PROFILE</a>
      </nav>
    </div>
</div>

<div class="orders-container">

    <!-- Top Bar -->
    <div class="orders-top">
      <div class="controls-left">
        <div class="search-wrapper">
          <i class="fa fa-search"></i>
          <input type="text" id="orderSearchInput" placeholder="Search order ID, customer, business">
        </div>

        <div class="sort-dropdown">
          <button class="sort-btn">Sort by: <span id="sort-value">Relevance</span> <i class="fa fa-caret-down"></i></button>
          <div class="sort-menu" id="sortMenu">
            <p data-sort="relevance">Relevance</p>
            <p data-sort="time">Time</p>
            <p data-sort="date">Date</p>
            <p data-sort="business">Business</p>
            <p data-sort="id">ID</p>
            <p data-sort="status">Status</p>
          </div>
        </div>
      </div>

      <p class="date-label" id="currentDate">Loading... | Loading...</p>
    </div>

    <!-- Tabs (static labels only) -->
    <div class="orders-tabs">
      <button class="tab active">ORDERS</button>
      <button class="tab">ISSUES</button>
    </div>

    <!-- Orders Table -->
    <div class="orders-table-wrapper">
      <table class="orders-table">
        <thead>
          <tr>
            <th>ORDER ID</th>
            <th>DATE</th>
            <th>CUSTOMER</th>
            <th>BUSINESS</th>
            <th>TOTAL</th>
            <th>STATUS</th>
            <th>ACTION</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

</div>

<script src="../../js/admin/admin-myorders.js"></script>
<script src="../../js/admin/admin-issues.js"></script>
<script src="../../js/admin/admin-shared-sort.js"></script>

</body>
</html>
