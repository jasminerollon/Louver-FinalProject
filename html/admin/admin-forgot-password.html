<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - Admin</title>
  <link rel="stylesheet" href="../../css/admin/admin-login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="left-section">
      <div class="login-card">
        <h2>FORGOT PASSWORD</h2>
        <form id="reset-password-form">
  <input type="text" placeholder="Username or Email" id="email" class="input-field" required />

  <!-- New password fields -->
  <input type="password" placeholder="New Password" id="new_password" class="input-field" required />
  <input type="password" placeholder="Confirm New Password" id="confirm_password" class="input-field" required />

  <button type="submit" class="login-btn">Reset Password</button>

  <p class="help-text">
    Enter the username or email associated with your admin account and your new password. Password must be at least 6 characters.
  </p>
  <a href="admin-login.html" class="back-link">Back to Login</a>
</form>

      </div>
    </div>

    <div class="right-section">
      <div class="partner-box">
        <h3>WELCOME TO</h3>
        <h1 class="louver">LOUVER</h1>
        <p>Crave it. Click it. Get it.</p>
      </div>
    </div>
  </div>

  <script>
document.getElementById('reset-password-form').addEventListener('submit', function(e) {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const new_password = document.getElementById('new_password').value.trim();
  const confirm_password = document.getElementById('confirm_password').value.trim();

  if (new_password !== confirm_password) {
    alert('Passwords do not match.');
    return;
  }

  if (new_password.length < 6) {
    alert('Password must be at least 6 characters.');
    return;
  }

  fetch('../../database/admin/resetPassword.php', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email, new_password, confirm_password})
  })
  .then(res => res.json())
  .then(data => {
    alert(data.message);
    if (data.status === 'success') {
      window.location.href = 'admin-login.html';
    }
  })
  .catch(err => console.error(err));
});
</script>

</body>
</html>
