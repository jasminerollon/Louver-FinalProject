<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Businesses</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/admin/admin-styles.css">
  <link rel="stylesheet" href="../../css/admin/admin-businesses.css">
</head>
<body>

  <div class="navbar">
    <div class="logo">
      <img src="../../assets/pictures/logo.png" alt="Louver Logo" style="height:60px; width:auto;" />
      <span>LOUVER</span>
    </div>

    <div class="navbar-right">
      <nav>
        <a href="admin-homepage.html">APPLICATIONS</a>
        <a href="admin-businesses.html" class="active">BUSINESSES</a>
        <a href="admin-myorders.html">ORDERS</a>
        <a href="admin-account.html">PROFILE</a>
      </nav>
    </div>
  </div>

  <div class="businesses-container">
    <!-- Top controls row -->
    <div class="businesses-top">
      <div class="controls-left">
        <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="businessSearchInput" placeholder="Search business name or owner name" />
        </div>
        <div class="sort-dropdown">
          <button class="sort-btn">
            Sort by: <span class="sort-label">Relevance</span>
            <i class="fas fa-caret-down"></i>
          </button>
          <div class="sort-menu" id="sortMenu">
            <p data-sort="relevance">Relevance</p>
            <p data-sort="status-online-first">Online First</p>
            <p data-sort="status-offline-first">Offline First</p>
            <p data-sort="name-asc">Name A → Z</p>
            <p data-sort="name-desc">Name Z → A</p>
          </div>
        </div>
      </div>

      <div class="top-right">
        
        <div class="date-time">
          <span id="currentDate">Dec 25, 2025 | 12:42 PM</span>
        </div>
      </div>
    </div>

    <!-- Cards grid -->
    <div class="cards-grid" id="businessCardsGrid"></div>
  </div>

  <script src="../../js/admin/admin-businesses.js"></script>
  <script src="../../js/admin/admin-common.js"></script>
</body>
</html>
