<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin - Applications</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../css/admin/admin-styles.css" />
    <link rel="stylesheet" href="../../css/admin/admin-homepage.css" />
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">
                    <img src="../../assets/pictures/logo.png" alt="Louver Logo" style="height:60px; width:auto;" />
            <span>LOUVER</span>
        </div>

        <div class="navbar-right">
            <nav>
                <a href="admin-homepage.html" class="active">APPLICATIONS</a>
                <a href="admin-businesses.html">BUSINESSES</a>
                <a href="admin-myorders.html">ORDERS</a>
                <a href="admin-account.html">PROFILE</a>
            </nav>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Top Section: Search + Sort -->
        <div class="top-section">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="appSearchInput" placeholder="Search application ID or name">
            </div>

            <div class="sort-dropdown">
                <button class="sort-btn">
                    Sort by: <span id="sortLabel">Relevance</span> <i class="fas fa-chevron-down"></i>
                </button>
                <div class="sort-menu" id="sortMenu">
                    <p data-sort="relevance">Relevance</p>
                    <p data-sort="newest">Newest</p>
                    <p data-sort="oldest">Oldest</p>
                    <p data-sort="status">By Status</p>
                </div>
            </div>

            <span class="date-label" id="currentDate">December 25, 2025 | 12:42 PM</span>
        </div>

        <!-- Applications Table -->
        <div class="table-wrapper">
            <table class="applications-table" id="applicationsTable">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll" aria-label="Select all applications"></th>
                        <th>APPLICATION ID</th>
                        <th>DATE SUBMITTED</th>
                        <th>BUSINESS NAME</th>
                        <th>OWNER</th>
                        <th>STATUS</th>
                        <th>ACTION</th>
                    </tr>
                </thead>
                <tbody id="applicationsTableBody">
                    <!-- Applications will be dynamically inserted here -->
                </tbody>
            </table>
        </div>
    </div>


    <!-- Application Detail Modal -->
<div class="modal-overlay" id="applicationModal">
  <div class="application-modal">

    <!-- Header -->
    <div class="app-header">
      <div class="header-left">
        <h1 id="modalBusinessName"></h1>
        <span class="status-pill" id="modalStatus"></span>
      </div>

      <div class="header-right">
        Submitted on:
        <span id="modalDateSubmitted"></span>
      </div>

      <button class="modal-close" id="closeModal">&times;</button>
    </div>

    <!-- Body -->
    <div class="app-body">

      <!-- LEFT DETAILS -->
      <div class="app-details">
        <div class="detail-row">
          <label>APPLICATION ID</label>
          <span id="modalAppId"></span>
        </div>

        <div class="detail-row">
          <label>BUSINESS REGISTRATION NUMBER</label>
          <span id="modalRegNo"></span>
        </div>

        <div class="detail-row">
          <label>LOCATION</label>
          <span id="modalLocation"></span>
        </div>

        <div class="detail-row">
          <label>OWNER NAME</label>
          <span id="modalOwnerName"></span>
        </div>

        <div class="detail-row">
          <label>CONTACT NUMBER</label>
          <span id="modalContact"></span>
        </div>

        <div class="detail-row">
          <label>EMAIL</label>
          <span id="modalEmail"></span>
        </div>
      </div>

      <!-- RIGHT PERMIT -->
      <div class="permit-section">
        <p class="permit-title">BUSINESS PERMIT</p>

        <div class="permit-preview">
          <iframe id="modalPermitLink" src="" frameborder="0"></iframe>
        </div>

        <a href="#" target="_blank" class="inspect-btn" id="inspectPermit">
          <i class="fas fa-eye"></i> Inspect
        </a>
      </div>
    </div>

    <!-- FOOTER ACTIONS -->
    <div class="modal-actions-center">
      <button class="approve-btn" id="btnApprove">APPROVE</button>
      <button class="reject-btn" id="btnReject">REJECT</button>
    </div>

  </div>
</div>

<!-- HIDDEN ELEMENTS REQUIRED BY JS (DO NOT REMOVE) -->
<div style="display:none;">

  <span id="modalAddress"></span>
  <span id="modalDescription"></span>

  <div id="modalActions"></div>

  <div class="rejection-section" id="rejectionSection">
    <textarea id="rejectionReason"></textarea>
  </div>

  <button id="btnCancel"></button>

</div>


    <!-- Scripts -->
    <script src="../../js/admin/admin-homepage.js"></script>
    <script src="../../js/admin/admin-common.js"></script>
</body>
</html>
