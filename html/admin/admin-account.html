<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile Overview</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="../../css/admin/admin-account.css">

</head>
<body>

<div class="navbar">
    <div class="logo">
        <img src="../../assets/pictures/logo.png" alt="Louver Logo" style="height:50px; width:auto;" />
        <span>LOUVER</span>
    </div>

    <div class="navbar-right">
        <nav>
            <a href="admin-homepage.html">APPLICATIONS</a>
            <a href="admin-businesses.html">BUSINESSES</a>
            <a href="admin-myorders.html">ORDERS</a>
            <a href="admin-account.html" class="active">PROFILE</a>
        </nav>
    </div>
</div>

<div class="container">

    <div class="top-row">
        <h1>Profile</h1>

        <div class="buttons">
            <a href="../../database/admin/logout.php">
                <button>Log out</button>
            </a>
            <a href="admin-edit-account.html">
                <button>Edit Profile</button>
            </a>
            <a href="admin-reset-password.html">
                <button>Change Password</button>
            </a>
        </div>
    </div>

    <div class="divider"></div>

    <div class="profile-card">
        <div class="profile-icon">
            <i class="fas fa-user"></i>
        </div>

        <div class="info">
            <div>
                <label>ADMIN ID</label>
                <p data-field="admin_id">Loading...</p>
            </div>

            <div>
                <label>NAME</label>
                <p data-field="name">Loading...</p>
            </div>

            <div>
                <label>EMAIL</label>
                <p data-field="email">Loading...</p>
            </div>

            <div>
                <label>MOBILE NUMBER</label>
                <p data-field="mobile_number">Loading...</p>
            </div>
        </div>
    </div>

<script src="../../js/admin/admin-account.js"></script>

</body>
</html>
