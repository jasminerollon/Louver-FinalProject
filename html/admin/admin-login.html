<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Louver</title>
    <link rel="stylesheet" href="../../css/admin/admin-login.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="login-card">
                <h2>WELCOME BACK ADMIN!</h2>
                <form id="adminLoginForm">
                    <input type="text" id="username" placeholder="Username" class="input-field" required />
                    <input type="password" id="password" placeholder="Password" class="input-field" required />
                    <button type="submit" class="login-btn">LOG IN</button>
                    <a href="#" class="forgot">Forgot Password</a>
                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                </form>
            </div>
        </div>

        <div class="right-section">
            <div class="partner-box">
                <h3>PARTNER UP WITH</h3>
                <h1 class="louver">LOUVER</h1>
                <p>Crave it. Click it. Get it.</p>
            </div>
        </div>
    </div>

    <script src="../../js/admin/admin-login.js"></script>
</body>
</html>
