<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="../../css/admin/admin-styles.css">
<link rel="stylesheet" href="../../css/admin/admin-reset-password.css">
</head>
<body>

<div class="navbar">
    <div class="logo">
                <img src="../../assets/pictures/logo.png" alt="Louver Logo" style="height:60px; width:auto;" />
        <span>LOUVER</span>
    </div>

    <div class="navbar-right">
        <nav>
            <a href="admin-homepage.html">APPLICATIONS</a>
            <a href="admin-businesses.html">BUSINESSES</a>
            <a href="admin-myorders.html">ORDERS</a>
            <a href="admin-account.html" class="active">PROFILE</a>
        </nav>
    </div>
</div>

<div class="reset-container">
    <div class="reset-header">
        <h1>Reset Password</h1>
        <div class="reset-actions">
            <button type="button" class="btn btn-cancel">Cancel</button>
            <button type="button" class="btn btn-save">Save Changes</button>
        </div>
    </div>

    <div class="divider"></div>

    <div class="reset-card">
        <div class="reset-left">
            <div class="reset-avatar">
                <i class="fas fa-user"></i>
            </div>
        </div>
        <div class="reset-right">
            <form id="passwordForm">
                <label for="new-password" class="field-label">New Password</label>
                <div class="field-wrap">
                    <input type="password" id="new-password" class="field-input" placeholder="Enter new password" required>
                    <button type="button" class="toggle-visibility" data-target="new-password" aria-label="Show password">
                        <i class="fa-solid fa-eye-slash"></i>
                    </button>
                </div>

                <label for="confirm-password" class="field-label">Confirm New Password</label>
                <div class="field-wrap">
                    <input type="password" id="confirm-password" class="field-input" placeholder="Re-enter new password" required>
                    <button type="button" class="toggle-visibility" data-target="confirm-password" aria-label="Show password">
                        <i class="fa-solid fa-eye-slash"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="../../js/admin/admin-reset-password.js"></script>
</body>
</html>
