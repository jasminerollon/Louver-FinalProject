<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edit Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="../../css/admin/admin-styles.css">
<link rel="stylesheet" href="../../css/admin/admin-edit-account.css">
</head>
<body>

<div class="navbar">
    <div class="logo">
                <img src="../../assets/pictures/logo.png" alt="Louver Logo" style="height:60px; width:auto;" />
        <span>LOUVER</span>
    </div>

    <div class="navbar-right">
        <nav>
            <a href="admin-homepage.html">APPLICATIONS</a>
            <a href="admin-businesses.html">BUSINESSES</a>
            <a href="admin-myorders.html">ORDERS</a>
            <a href="admin-account.html" class="active">PROFILE</a>
        </nav>
    </div>
</div>

<div class="container">
    <div class="top-row">
        <h1>Edit Profile</h1>
        <div class="buttons">
            <a href="admin-account.html"><button class="btn-cancel">Cancel</button></a>
            <button id="save-changes" class="btn-confirm">Save Changes</button>
        </div>
    </div>

    <div class="divider"></div>

    <div class="profile-card edit-profile">
    <div class="profile-picture-wrapper">
    <div class="profile-icon" id="profile-icon">
        <i class="fas fa-user"></i>
    </div>

    <button class="upload-btn" id="upload-btn">
        <i class="fas fa-upload"></i> Upload
    </button>

    <button class="remove-btn" id="remove-photo" style="display:none;">
        <i class="fas fa-trash"></i> Remove Photo
    </button>

    <input type="file" id="upload-input" style="display: none;" accept="image/*">
</div>


    <div class="info">
        <label for="name">NAME</label>
        <input type="text" id="name" placeholder="Enter full name">

        <label for="email">EMAIL</label>
        <input type="email" id="email" placeholder="name@example.com">

        <label for="phone">MOBILE NUMBER</label>
        <input type="text" id="phone" placeholder="09xxxxxxxxx">
    </div>
</div>

</div>

<script src="../../js/admin/admin-edit-account.js"></script>
</body>
</html>
