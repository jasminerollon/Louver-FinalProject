<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Louver Login</title>
    <link rel="stylesheet" href="../../css/business-owner/business-owner-styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
    <!-- INVALID CREDENTIALS MODAL -->
    <div id="errorModal" class="modal">
        <div class="modal-content">
            <h2>Invalid credentials</h2>
            <p>We could not find your application. Please check your email and password carefully.</p>
            <button id="closeModalBtn" class="modal-btn">OK</button>
        </div>
    </div>

    <div class="container">
        <div class="left-section">
            <div class="login-card">
               <form action="../../database/business-owner/businessLogin.php" method="POST">
                    <h2>WELCOME BACK!</h2>
                    <input type="email" name="email" placeholder="Email" class="input-field" required />
                    <input type="password" name="password" placeholder="Password" class="input-field" required />
                    <button type="submit" class="login-btn">LOG IN</button>
                    <a href="#" class="forgot">Forgot Password</a>
                </form>
            </div>
        </div>

        <div class="right-section">
            <div class="partner-box">
                <h3>PARTNER UP WITH</h3>
                <h1 class="louver">LOUVER</h1>
                <p>Crave it. Click it. Get it.</p>
                <a href="business-owner-registration.html" class="register-btn">REGISTER BUSINESS</a>
            </div>
        </div>
    </div>

    <!-- Separate JS file -->
    <script src="../../js/business-owner/business-owner-login.js"></script>
</body>
</html>
