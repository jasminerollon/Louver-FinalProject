<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Application Status</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, system-ui; background: #faefef; margin:0; }
    .wrapper { max-width: 760px; margin: 40px auto; text-align: center; padding: 0 16px; }
    .back { display:inline-flex; align-items:center; gap:8px; border:none; background:#fff; color:#8c1c1c; padding:8px 12px; border-radius:10px; box-shadow: 0 2px 0 #e49b9b; cursor:pointer; }
    .title { font-size: 28px; font-weight: 700; color: #8c1c1c; margin-top: 18px; }
    .status { font-size: 48px; font-weight: 800; color: #b21f1f; margin: 20px 0; }
    .card { background: #fff7f7; border: 2px solid #e49b9b; border-radius: 16px; padding: 20px; box-shadow: 0 4px 0 #e49b9b; }
    .card h3 { margin: 0 0 8px; color: #b21f1f; font-weight:700; }
    .card p { margin: 0; color: #911; }
    .list { text-align: left; max-width: 520px; margin: 16px auto 0; color: #911; }
    .btn { margin-top: 18px; background: #b21f1f; color: #fff; border: none; padding: 10px 16px; border-radius: 999px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrapper">
    <button class="back" id="backBtn" type="button">
      <span style="font-weight:800">←</span>
      <span>Back</span>
    </button>
    <div class="title">Application Status</div>
    <div id="statusText" class="status">Pending</div>
    <div class="card" id="statusCard">
      <h3 id="cardTitle">In progress</h3>
      <p id="cardMessage">Your application is being reviewed and processed by the admins. Check back soon for updates.</p>
      <div class="list" id="rejectList" style="display:none"></div>
      <button class="btn" id="applyAgainBtn" style="display:none">Apply again</button>
    </div>
  </div>

  <script>
    // Read credentials from query params
    const url = new URL(window.location.href);
    const email = url.searchParams.get('email') || '';
    const temp = url.searchParams.get('temp') || '';

    // Back button
    const backBtn = document.getElementById('backBtn');
    if (backBtn) {
      backBtn.addEventListener('click', function(){
        // Prefer going back to login page for owners
        window.location.href = '../../html/business-owner/business-owner-login.html';
      });
    }

    async function fetchStatus() {
      try {
        const form = new FormData();
        form.append('email', email);
        form.append('temp_password', temp);
        const res = await fetch('../../database/business-owner/checkApplicationStatus.php', { method: 'POST', body: form });
        const data = await res.json();
        if (!res.ok || data.status !== 'success') throw new Error(data.message || 'Failed');
        const s = data.data.status;
        const reason = data.data.rejection_reason || '';
        const statusText = document.getElementById('statusText');
        const cardTitle = document.getElementById('cardTitle');
        const cardMessage = document.getElementById('cardMessage');
        const rejectList = document.getElementById('rejectList');
        const applyBtn = document.getElementById('applyAgainBtn');

        if (s === 'Pending') {
          statusText.textContent = 'Pending';
          cardTitle.textContent = 'In progress';
          cardMessage.textContent = 'Your application is being reviewed and processed by the admins. Check back soon for updates.';
          rejectList.style.display = 'none';
          applyBtn.style.display = 'none';
        } else if (s === 'Rejected') {
          statusText.textContent = 'Rejected';
          cardTitle.textContent = 'Thank you.';
          cardMessage.textContent = 'Your application did not meet the required criteria and has been rejected. Please review the requirements and reapply once all qualifications are met.';
          rejectList.style.display = 'block';
          rejectList.innerHTML = reason ? `<ul><li>${reason}</li></ul>` : '';
          applyBtn.style.display = 'inline-block';
          applyBtn.onclick = () => { window.location.href = '../../html/business-owner/business-owner-registration.html'; };
        } else if (s === 'Approved') {
          // Establish session using temp credentials, then redirect
          const form = new FormData();
          form.append('email', email);
          form.append('password', temp);
          const loginRes = await fetch('../../database/business-owner/business-owner-newLogin.php', { method: 'POST', body: form });
          const loginData = await loginRes.json();
          if (loginRes.ok && loginData && loginData.success) {
            window.location.href = '../../html/business-owner/business-owner-products.html';
          } else {
            // Fallback to login page with prefilled email
            const params = new URLSearchParams({ email });
            window.location.href = '../../html/business-owner/business-owner-login.html?' + params.toString();
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    fetchStatus();
  </script>
</body>
</html>
