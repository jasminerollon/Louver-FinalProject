<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/business-owner/business-owner-edit-products.css">
</head>

<body>

    <!-- NAVIGATION -->
    <header class="navbar">
        <div class="logo-section">
            <img src="../../assets/pictures/logo.svg" class="logo">
            <span class="brand">LOUVER</span>
        </div>

        <nav class="nav-links">
            <a class="active">PRODUCTS</a>
            <a>ORDERS</a>
            <a>PROFILE</a>
        </nav>
    </header>

    <!-- PAGE WRAPPER -->
    <div class="page-wrapper">

        <div class="title-row">
            <h1 class="title">Edit Product</h1>

            <div class="top-buttons">
                <button class="cancel-btn">Cancel</button>
                <button class="delete-btn">Delete Product</button>
                <button class="save-btn">Save Changes</button>
            </div>
        </div>

        <!-- FORM CARD -->
        <div class="form-card">

            <div class="left-upload">
                <div class="upload-box">
                    <img src="" class="product-image">
                </div>
                <button class="upload-btn">Upload Image</button>
            </div>

            <div class="form-fields">
                <label>NAME</label>
                <input type="text" value="">

                <label>DESCRIPTION</label>
                <textarea></textarea>

                <label>PRICE</label>
                <input type="text" value="">
            </div>

        </div>

    </div>

</body>
</html>
