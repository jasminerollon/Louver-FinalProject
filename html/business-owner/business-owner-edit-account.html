<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile | Louver</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/business-owner/business-owner-accounts.css">
    <link rel="stylesheet" href="../../css/business-owner/business-owner-style.css">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">
        <img src="../../assets/pictures/logo.png" style="height:60px;">
        <span>LOUVER</span>
    </div>

    <nav>
        <a href="business-owner-products.html">PRODUCTS</a>
        <a href="business-owner-myorders.php">ORDERS</a>
        <a href="business-owner-account.html" class="active">PROFILE</a>
    </nav>
</div>

<!-- MAIN CONTENT -->
<div class="container">

    <div class="top-row">
        <h1>Edit Profile</h1>
        <div class="buttons">
            <button class="cancel-btn" id="cancel-btn">Cancel</button>
            <button class="save-btn" id="save-btn">Save Changes</button>
        </div>
    </div>

    <div class="divider"></div>

    <div class="profile-card">

        <div class="profile-images">
            <div class="profile-img-wrapper">
                <div class="profile-img-left">
                    <img src="../../assets/pictures/default.png" alt="Profile Picture" id="profile-img-preview">
                    <input type="file" id="profile-img" accept="image/*" style="display:none;">
                </div>
                <button type="button" id="change-profile-btn">Change Profile</button>
            </div>

            <div class="profile-img-wrapper">
                <div class="profile-img-right">
                    <img src="../../assets/pictures/banner_default.jpg" alt="Banner Picture" id="banner-img-preview">
                    <input type="file" id="banner-img" accept="image/*" style="display:none;">
                </div>
                <button type="button" id="change-banner-btn">Change Banner</button>
            </div>
        </div>

        <div class="info">
            <div class="info-group">
                <label>BUSINESS NAME</label>
                <input type="text" id="business_name">
            </div>

            <div class="info-group">
                <label>OWNER NAME</label>
                <input type="text" id="owner_name">
            </div>

            <div class="info-group">
                <label>EMAIL</label>
                <input type="email" id="email">
            </div>

            <div class="info-group">
                <label>MOBILE NUMBER</label>
                <input type="text" id="contact_number">
            </div>

            <!-- ADD THIS BUSINESS PERMIT FIELD -->
            <div class="info-group">
                <label>BUSINESS PERMIT</label>
                <input type="file" id="business_permit" accept=".pdf,.jpg,.jpeg,.png">
                <small style="font-size: 12px; color: #666;">Upload PDF, JPG, or PNG files</small>
            </div>

            <div class="info-group">
                <label>ADDRESS</label>
                <input type="text" id="address">
            </div>
        </div>

    </div>

    <!-- Notification Modal -->
    <div id="notification-modal" class="modal-overlay">
        <div class="report-modal">
            <p id="notification-message"></p>
            <div class="report-buttons">
                <button class="confirm-report" id="notification-ok-btn">OK</button>
            </div>
        </div>
    </div>

</div>

<!-- REMOVE INLINE JAVASCRIPT AND USE EXTERNAL FILE ONLY -->
<script src="../../js/business-owner/business-owner-edit-account.js"></script>
</body>
</html>
