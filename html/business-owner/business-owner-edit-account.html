<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile | Louver</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/business-owner/business-owner-accounts.css">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">
        <img src="../../assets/pictures/logo.png" style="height:60px;">
        <span>LOUVER</span>
    </div>

    <nav class="nav-links">
        <a href="business-owner-products.html">PRODUCTS</a>
        <a href="business-owner-orders.html">ORDERS</a>
        <a href="business-owner-account.html" class="active">PROFILE</a>
    </nav>
</div>

<!-- MAIN CONTENT -->
<div class="container">

    <div class="top-row">
        <h1>Edit Profile</h1>
        <div class="buttons">
            <button class="cancel-btn">Cancel</button>
            <button class="save-btn">Save Changes</button>
        </div>
    </div>

    <div class="divider"></div>

    <div class="profile-card">

        <!-- PROFILE IMAGES -->
        <div class="profile-images">

            <div class="profile-img-left">
                <img src="../../assets/pictures/default-profile.png" alt="Profile Picture">
            </div>

            <div class="profile-img-right">
                <img src="../../assets/pictures/default-banner.png" alt="Banner Picture">
            </div>

        </div>

        <!-- FORM GRID -->
        <div class="info">

            <div class="info-group">
                <label>BUSINESS NAME</label>
                <input type="text" value="Jollibee">
            </div>

            <div class="info-group">
                <label>OWNER NAME</label>
                <input type="text" value="John Pork">
            </div>

            <div class="info-group">
                <label>EMAIL</label>
                <input type="text" value="jollibeeSAMCIS@slu.edu.ph">
            </div>

            <div class="info-group">
                <label>LAST NAME</label>
                <input type="text" value="John Pork">
            </div>

            <div class="info-group">
                <label>MOBILE NUMBER</label>
                <input type="text" value="09123456789">
            </div>

            <div class="info-group">
                <label>BUSINESS REGISTRATION NUMBER</label>
                <input type="text" value="870-000-143">
            </div>

            <div class="info-group">
                <label>LOCATION</label>
                <input type="text" value="Devesse Lobby">
            </div>

        </div>

    </div>

</div>

</body>
</html>
