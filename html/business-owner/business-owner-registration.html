<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Louver Registration</title>
    <link rel="stylesheet" href="../../css/business-owner/business-registration-styles.css">

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">
        <div class="register-card">
            <h2>REGISTER BUSINESS</h2>

            <input type="text" placeholder="Business Name">
            <input type="text" placeholder="Business Registration Number">
            <input type="text" placeholder="Location">

            <div class="upload-field">
                <span>📂 Upload Business Permit</span>
            </div>

            <hr>

            <input type="text" placeholder="First Name">
            <input type="text" placeholder="Last Name">
            <input type="text" placeholder="Contact Number">
            <input type="email" placeholder="Email">

            <button class="signup-btn">SIGN UP</button>
        </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">
        <div class="promo">
            <h3>PARTNER UP WITH</h3>
            <h1>LOUVER</h1>
            <p>Crave it. Click it. Get it.</p>

            <p class="status-text">Check Application Status / Already have an account</p>
            <button class="login-btn">LOG IN</button>
        </div>
    </div>

</div>

</body>
</html>
