<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Louver Registration</title>
    <link rel="stylesheet" href="../../css/business-owner/business-registration-styles.css">

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">
    <form class="register-card" action="../../database/business-owner/businessRegistration.php" method="POST" enctype="multipart/form-data">
        <h2>REGISTER BUSINESS</h2>

        <input type="text" name="business_name" placeholder="Business Name" required>
        <input type="text" name="business_number" placeholder="Business Registration Number" required>
        <input type="text" name="location" placeholder="Location" required>

     <div class="upload-field">
    <img src="../../assets/pictures/upload-icon.png" class="upload-icon">

    <span class="upload-text" id="file-label">Upload Business Permit</span>

    <input type="file" name="business_permit" id="business_permit" class="upload-input">
    </div>


        <hr>

        <input type="text" name="first_name" placeholder="First Name" required>
        <input type="text" name="last_name" placeholder="Last Name" required>
        <input type="text" name="contact_number" placeholder="Contact Number" required>
        <input type="email" name="email" placeholder="Email" required>

        <button type="submit" class="signup-btn">SIGN UP</button>
    </form>
</div>


    <!-- RIGHT SIDE -->
    <div class="right">
        <div class="promo">
            <h3>PARTNER UP WITH</h3>
            <h1>LOUVER</h1>
            <p>Crave it. Click it. Get it.</p>

            <p class="status-text">Check Application Status / Already have an account</p>
            <button class="login-btn" id="goLoginBtn">LOG IN</button>
            <button class="login-btn" id="checkStatusRegBtn" style="margin-top:10px; background:#8b1a1a;">CHECK APPLICATION STATUS</button>
        </div>
    </div>

</div>
<script src="../../js/business-owner/business-owner-registration.js"></script>
<script>
    // Auto-show Temporary Credentials modal after registration
    (function(){
        const url = new URL(window.location.href);
        const show = url.searchParams.get('showTemp');
        const email = url.searchParams.get('email') || '';
        const temp = url.searchParams.get('temp') || '';
        if (show === '1') {
            const overlay = document.createElement('div');
            overlay.style.position = 'fixed';
            overlay.style.inset = '0';
            overlay.style.background = 'rgba(0,0,0,0.35)';
            overlay.style.display = 'flex';
            overlay.style.alignItems = 'center';
            overlay.style.justifyContent = 'center';
            overlay.style.zIndex = '9999';

            const modal = document.createElement('div');
            modal.style.background = '#fff7f7';
            modal.style.border = '2px solid #b21f1f';
            modal.style.boxShadow = '0 6px 0 #e49b9b';
            modal.style.borderRadius = '16px';
            modal.style.padding = '24px 28px';
            modal.style.maxWidth = '460px';
            modal.style.width = '90%';
            modal.style.textAlign = 'center';

            const title = document.createElement('h2');
            title.textContent = 'Temporary Credentials';
            title.style.color = '#b21f1f';
            title.style.margin = '0 0 12px';

            const emailPill = document.createElement('div');
            emailPill.textContent = email;
            emailPill.style.border = '2px solid #b21f1f';
            emailPill.style.color = '#b21f1f';
            emailPill.style.borderRadius = '999px';
            emailPill.style.padding = '10px 14px';
            emailPill.style.margin = '8px 0';
            emailPill.style.wordBreak = 'break-all';

            const tempPill = emailPill.cloneNode();
            tempPill.textContent = temp;

            const note = document.createElement('div');
            note.textContent = 'Use these temporary credentials to check the status of your application.';
            note.style.fontSize = '12px';
            note.style.color = '#7a1a1a';
            note.style.marginTop = '6px';

            const actions = document.createElement('div');
            actions.style.marginTop = '16px';

            const statusBtn = document.createElement('button');
            statusBtn.textContent = 'Check Status';
            statusBtn.style.background = '#b21f1f';
            statusBtn.style.color = '#fff';
            statusBtn.style.border = 'none';
            statusBtn.style.padding = '10px 16px';
            statusBtn.style.borderRadius = '999px';
            statusBtn.style.cursor = 'pointer';
            statusBtn.onclick = () => {
                const params = new URLSearchParams({ email, temp });
                window.location.href = 'application-status.html?' + params.toString();
            };

            const closeBtn = document.createElement('button');
            closeBtn.textContent = 'Close';
            closeBtn.style.marginLeft = '10px';
            closeBtn.style.background = '#e8b7b7';
            closeBtn.style.color = '#5c1212';
            closeBtn.style.border = 'none';
            closeBtn.style.padding = '10px 16px';
            closeBtn.style.borderRadius = '999px';
            closeBtn.style.cursor = 'pointer';
            closeBtn.onclick = () => document.body.removeChild(overlay);

            actions.appendChild(statusBtn);
            actions.appendChild(closeBtn);

            modal.appendChild(title);
            modal.appendChild(emailPill);
            modal.appendChild(tempPill);
            modal.appendChild(note);
            modal.appendChild(actions);

            overlay.appendChild(modal);
            document.body.appendChild(overlay);
        }
    })();

    // Wire buttons on the right panel
    (function(){
        const goLogin = document.getElementById('goLoginBtn');
        if (goLogin) {
            goLogin.addEventListener('click', function(){
                window.location.href = 'business-owner-login.html';
            });
        }
                const checkBtn = document.getElementById('checkStatusRegBtn');
                if (checkBtn) {
                        checkBtn.addEventListener('click', function(){
                                // Simple modal prompt UI
                                const overlay = document.createElement('div');
                                overlay.style.position = 'fixed';
                                overlay.style.inset = '0';
                                overlay.style.background = 'rgba(0,0,0,0.5)';
                                overlay.style.display = 'flex';
                                overlay.style.alignItems = 'center';
                                overlay.style.justifyContent = 'center';
                                overlay.style.zIndex = '9999';

                                const box = document.createElement('div');
                                box.style.background = '#1e1e1e';
                                box.style.color = '#fff';
                                box.style.border = '2px solid #8b1a1a';
                                box.style.borderRadius = '10px';
                                box.style.padding = '20px';
                                box.style.minWidth = '320px';
                                box.style.boxShadow = '0 6px 0 #3a0a0a';

                                const title = document.createElement('div');
                                title.textContent = 'ENTER CREDENTIALS';
                                title.style.fontFamily = 'Inter, system-ui';
                                title.style.fontWeight = '800';
                                title.style.marginBottom = '8px';

                                const label = document.createElement('div');
                                label.textContent = 'Enter your application email:';
                                label.style.margin = '6px 0 8px';

                                const emailInput = document.createElement('input');
                                emailInput.type = 'email';
                                emailInput.placeholder = 'Email';
                                emailInput.style.width = '100%';
                                emailInput.style.padding = '10px 12px';
                                emailInput.style.borderRadius = '8px';
                                emailInput.style.border = '1px solid #8b1a1a';
                                emailInput.style.background = '#111';
                                emailInput.style.color = '#fff';

                                const label2 = document.createElement('div');
                                label2.textContent = 'Enter your temporary password:';
                                label2.style.margin = '12px 0 8px';

                                const tempInput = document.createElement('input');
                                tempInput.type = 'password';
                                tempInput.placeholder = 'Temporary Password';
                                tempInput.style.width = '100%';
                                tempInput.style.padding = '10px 12px';
                                tempInput.style.borderRadius = '8px';
                                tempInput.style.border = '1px solid #8b1a1a';
                                tempInput.style.background = '#111';
                                tempInput.style.color = '#fff';

                                const actions = document.createElement('div');
                                actions.style.display = 'flex';
                                actions.style.gap = '10px';
                                actions.style.justifyContent = 'flex-end';
                                actions.style.marginTop = '16px';

                                const okBtn = document.createElement('button');
                                okBtn.textContent = 'OK';
                                okBtn.style.background = '#8b1a1a';
                                okBtn.style.color = '#fff';
                                okBtn.style.border = 'none';
                                okBtn.style.padding = '8px 14px';
                                okBtn.style.borderRadius = '8px';
                                okBtn.style.cursor = 'pointer';

                                const cancelBtn = document.createElement('button');
                                cancelBtn.textContent = 'Cancel';
                                cancelBtn.style.background = '#555';
                                cancelBtn.style.color = '#ddd';
                                cancelBtn.style.border = 'none';
                                cancelBtn.style.padding = '8px 14px';
                                cancelBtn.style.borderRadius = '8px';
                                cancelBtn.style.cursor = 'pointer';

                                const submitFlow = () => {
                                    const email = (emailInput.value || '').trim();
                                    const temp = (tempInput.value || '').trim();
                                    if (!email || !temp) return;
                                    const form = new FormData();
                                    form.append('email', email);
                                    form.append('temp_password', temp);
                                    fetch('../../database/business-owner/checkApplicationStatus.php', { method:'POST', body: form })
                                        .then(r => r.json())
                                        .then(data => {
                                            if (data && data.status === 'success') {
                                                const s = data.data.status;
                                                if (s === 'Approved') {
                                                    const lf = new FormData();
                                                    lf.append('email', email);
                                                    lf.append('password', temp);
                                                    fetch('../../database/business-owner/business-owner-newLogin.php', { method:'POST', body: lf })
                                                        .then(res => res.json())
                                                        .then(ld => {
                                                            if (ld && ld.success) {
                                                                window.location.href = 'business-owner-products.html';
                                                            } else {
                                                                const params = new URLSearchParams({ email, temp });
                                                                window.location.href = 'application-status.html?' + params.toString();
                                                            }
                                                        });
                                                } else {
                                                    const params = new URLSearchParams({ email, temp });
                                                    window.location.href = 'application-status.html?' + params.toString();
                                                }
                                            } else {
                                                alert((data && data.message) || 'Application not found');
                                            }
                                        })
                                        .catch(() => alert('Error checking status'))
                                        .finally(() => document.body.removeChild(overlay));
                                };

                                okBtn.onclick = submitFlow;
                                cancelBtn.onclick = () => document.body.removeChild(overlay);
                                overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
                                tempInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitFlow(); });

                                actions.appendChild(okBtn);
                                actions.appendChild(cancelBtn);
                                box.appendChild(title);
                                box.appendChild(label);
                                box.appendChild(emailInput);
                                box.appendChild(label2);
                                box.appendChild(tempInput);
                                box.appendChild(actions);
                                overlay.appendChild(box);
                                document.body.appendChild(overlay);
                                emailInput.focus();
                        });
                }
    })();
</script>
</body>
</html>
