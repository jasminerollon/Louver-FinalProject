<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="../../css/business-owner/business-owner-forgot-password.css" />
</head>
<body>
    <div class="container">
        <div class="left-section">
            <h2>WELCOME TO</h2>
            <h1 class="brand">LOUVER</h1>
            <p class="tagline">Crave it. Click it. Get it.</p>
        </div>

        <div class="right-section">
            <div class="card">
                <h3>RESET YOUR PASSWORD</h3>
                <form id="resetPasswordForm">
                    <input type="email" name="email" placeholder="Email" required />
                    <input type="password" name="new_password" placeholder="New Password" required />
                    <input type="password" name="confirm_password" placeholder="Confirm New Password" required />
                    <button type="submit" id="resetBtn">Reset Password</button>
                </form>
                <p id="message" style="color:red; margin-top:10px;"></p>
            </div>
        </div>
    </div>

    <script src="../../js/business-owner/business-owner-forgot-password.js"></script>
</body>
</html>
