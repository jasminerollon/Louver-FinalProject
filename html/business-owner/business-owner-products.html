<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/business-owner/business-owner-products-management.css">
</head>

<body>

    <!-- NAVIGATION -->
    <header class="navbar">
        <div class="logo-section">
            <img src="../../assets/pictures/logo.svg" class="logo">
            <span class="brand">LOUVER</span>
        </div>

        <nav class="nav-links">
            <a class="active">PRODUCTS</a>
            <a>ORDERS</a>
            <a>PROFILE</a>
        </nav>
    </header>

    <!-- PAGE CONTENT -->
    <div class="page-wrapper">

        <!-- SEARCH + ADD BUTTON ROW -->
        <div class="top-row">

            <div class="search-box">
                <img src="search-icon.png" class="search-icon">
                <input type="text" placeholder="Search product name">
            </div>

            <button class="add-btn">Add Product</button>
        </div>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab active">Table</button>
            <button class="tab">Gallery</button>
        </div>

        <!-- PRODUCT TABLE CARD -->
        <div class="table-card">

            <!-- HEADER ROW -->
            <div class="header-row">
                <div class="col image-col">IMAGE</div>
                <div class="col name-col">PRODUCT NAME</div>
                <div class="col desc-col">DESCRIPTION</div>
                <div class="col price-col">UNIT PRICE</div>
                <div class="col modify-col">MODIFY</div>
            </div>

            <!-- PRODUCT ITEM (REPEAT THIS FOR MORE ITEMS) -->
            <div class="product-row">
                <img src="p1.png" class="prod-img">

                <div class="prod-name"></div>

                <div class="prod-desc">
                </div>

                <div class="prod-price"></div>

                <div class="prod-edit">
                    <img src="edit-icon.png" class="edit-icon">
                </div>
            </div>

            <div class="divider"></div>

            <!-- PRODUCT 2 -->
            <div class="product-row">
                <img src="p2.png" class="prod-img">

                <div class="prod-name"></div>

                <div class="prod-desc">
                   
                </div>

                <div class="prod-price"></div>

                <div class="prod-edit">
                    <img src="edit-icon.png" class="edit-icon">
                </div>
            </div>

            <div class="divider"></div>

            <!-- PRODUCT 3 -->
            <div class="product-row">
                <img src="p3.png" class="prod-img">

                <div class="prod-name"></div>

                <div class="prod-desc">
                   
                </div>

                <div class="prod-price"></div>

                <div class="prod-edit">
                    <img src="edit-icon.png" class="edit-icon">
                </div>
            </div>

            <div class="divider"></div>

            <!-- PRODUCT 4 -->
            <div class="product-row">
                <img src="p4.png" class="prod-img">

                <div class="prod-name"></div>

                <div class="prod-desc">
                   
                </div>

                <div class="prod-price"></div>

                <div class="prod-edit">
                    <img src="edit-icon.png" class="edit-icon">
                </div>
            </div>

            <div class="divider"></div>

            <!-- PRODUCT 5 -->
            <div class="product-row">
                <img src="p5.png" class="prod-img">

                <div class="prod-name"></div>

                <div class="prod-desc">
                   
                </div>

                <div class="prod-price"></div>

                <div class="prod-edit">
                    <img src="edit-icon.png" class="edit-icon">
                </div>
            </div>

        </div>

    </div>

</body>
</html>
