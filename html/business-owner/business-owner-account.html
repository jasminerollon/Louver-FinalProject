<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Business Profile | Louver</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../../css/business-owner/business-owner-accounts.css">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">
        <img src="../../assets/pictures/logo.png" style="height:35px;">
        <span>LOUVER</span>
    </div>

    <nav class="nav-links">
        <a href="business-owner-products.html">PRODUCTS</a>
        <a href="business-owner-orders.html">ORDERS</a>
        <a href="business-owner-account.html" class="active">PROFILE</a>
    </nav>
</div>

<!-- MAIN CONTAINER -->
<div class="container">

    <div class="top-row">
        <h1>Business Profile</h1>

        <div class="buttons">
            <a href="business-owner-edit-account.html">
                <button>Edit Profile</button>
            </a>

            <a href="business-owner-reset-password.html">
                <button>Change Password</button>
            </a>
        </div>
    </div>

    <div class="divider"></div>

    <!-- PROFILE CARD -->
    <div class="profile-card">

        <!-- IMAGES ROW -->
        <div class="profile-images">
            <div class="profile-img-left">
                <img src="../../assets/pictures/sample-brand-logo.png">
            </div>

            <div class="profile-img-right">
                <img src="../../assets/pictures/sample-banner.png">
            </div>
        </div>

        <!-- INFO GRID -->
        <div class="info">

            <div class="info-group">
                <label>BUSINESS NAME</label>
                <p>Jollibee</p>
            </div>

            <div class="info-group">
                <label>BUSINESS REGISTRATION NUMBER</label>
                <p class="highlight">870-000-143</p>
            </div>

            <div class="info-group">
                <label>EMAIL</label>
                <p>jollibeeSAMCIS@slu.edu.ph</p>
            </div>

            <div class="info-group">
                <label>LOCATION</label>
                <p>Devesse Lobby</p>
            </div>

            <div class="info-group">
                <label>MOBILE NUMBER</label>
                <p>09123456789</p>
            </div>

            <div class="info-group">
                <label>BUSINESS PERMIT</label>

                <div class="permit-buttons">
                    <button class="view-btn">View</button>
                    <button class="update-btn">Update</button>
                </div>
            </div>

            <div class="info-group">
                <label>OWNER NAME</label>
                <p>John Pork</p>
            </div>

        </div>

    </div>

</div>

</body>
</html>
