<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Profile | Louver</title>

    <link rel="stylesheet" href="../../css/business-owner/business-owner-accounts.css">
    <link rel="stylesheet" href="../../css/business-owner/business-owner-style.css">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">
        <img src="../../assets/pictures/logo.png" style="height:60px;">
        <span>LOUVER</span>
    </div>

    <nav>
        <a href="business-owner-products.html">PRODUCTS</a>
        <a href="business-owner-myorders.php">ORDERS</a>
        <a href="business-owner-account.html" class="active">PROFILE</a>
    </nav>
</div>

<div class="container">

    <div class="top-row">
        <h1>Business Profile</h1>

        <div class="buttons">
    <a href="business-owner-edit-account.html">
        <button>Edit Profile</button>
    </a>

    <a href="business-owner-reset-password.html">
        <button>Change Password</button>
    </a>

    <button id="logoutBtn" class="logout-btn">Log Out</button>
</div>
    </div>

    <div class="divider"></div>

    <!-- PROFILE CARD -->
    <div class="profile-card">

        <!-- IMAGES -->
        <div class="profile-images">
            <div class="profile-img-left">
                <img id="profileImage" src="../../assets/pictures/default.png">
            </div>

            <div class="profile-img-right">
                <img id="bannerImage" src="../../assets/pictures/banner_default.jpg">
            </div>
        </div>

        <!-- INFO -->
        <div class="info">

            <div class="info-group">
                <label>BUSINESS NAME</label>
                <p id="businessName"></p>
            </div>

            <div class="info-group">
                <label>BUSINESS REGISTRATION NUMBER</label>
                <p class="highlight" id="businessID"></p>
            </div>

            <div class="info-group">
                <label>EMAIL</label>
                <p id="email"></p>
            </div>

            <div class="info-group">
                <label>LOCATION</label>
                <p id="location"></p>
            </div>

            <div class="info-group">
                <label>MOBILE NUMBER</label>
                <p id="contact"></p>
            </div>

           <div class="info-group">
                <label>BUSINESS PERMIT</label>
                <div class="permit-buttons">
                    <a id="viewPermit" href="#" class="permit-action">
                        <button class="view-btn">
                            <i class="view-icon"></i> View Permit
                        </button>
                    </a>
                </div>
            </div>
            <div class="info-group">
                <label>OWNER NAME</label>
                <p id="ownerName"></p>
            </div>

        </div>

    </div>

</div>

<!-- JS -->
<script src="../../js/business-owner/business-owner-account.js"></script>

</body>
</html>
