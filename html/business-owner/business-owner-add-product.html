<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <link rel="stylesheet" href="../../css/business-owner/business-owner-product.css">

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

</head>
<body>

    <!-- TOP NAV -->
    <header class="navbar">
        <div class="logo-section">
            <img src="/assets/pictures/logo.png" class="logo">
            <span class="brand">LOUVER</span>
        </div>

        <nav class="nav-links">
            <a class="active">PRODUCTS</a>
            <a>ORDERS</a>
            <a>PROFILE</a>
        </nav>
    </header>

<!-- PAGE WRAPPER -->
<div class="page-wrapper">

    <div class="title-header">
        <h1 class="title">Add Product</h1>

        <div class="top-buttons">
            <button class="cancel-btn">Cancel</button>
            <button class="save-btn">Save Product</button>
        </div>
    </div>

    <!-- FORM BOX -->
    <div class="form-card">

        <div class="left-upload">
            <div class="upload-box">
                <img src="upload-icon.png" class="upload-icon">
            </div>
            <button class="upload-btn">Upload Image</button>
        </div>

        <div class="form-fields">
            <label>NAME</label>
            <input type="text">

            <label>DESCRIPTION</label>
            <input type="text">

            <label>PRICE</label>
            <input type="text">
        </div>

    </div>

</div>
</body>
</html>
