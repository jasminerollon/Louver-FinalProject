<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Cart</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="../../css/user/customer-cart.css" />
</head>
<body>

  <!-- Navbar -->
  <header class="navbar" role="banner">
    <div class="logo">
      <img src="../../assets/pictures/logo.png" alt="Louver logo" class="logo-img">
      <span>LOUVER</span>
    </div>

    <div class="navbar-right">
      <nav aria-label="Main navigation">
        <a href="customer-homepage.html">BROWSE</a>
        <a href="myorders.html">MY ORDERS</a>
        <a href="account.html">PROFILE</a>
      </nav>

      <div class="cart" title="Cart" role="button" aria-label="View cart">
        <img src="../../assets/pictures/cart.png" alt="Cart" class="cart-icon">
        <span class="cart-count" aria-live="polite" style="display: none;">0</span>
      </div>
    </div>
  </header>

  <main class="container" role="main">
    <!-- Page Title -->
    <div class="page-header">
      <h1>My Cart</h1>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <!-- Cart Content -->
    <div class="content">
      <!-- Left Side: Cart Items -->
      <div class="cart-items" id="cartItemsContainer">
        <!-- Cart items will be dynamically inserted here -->
        <!-- Example cart card structure:
        <div class="cart-card">
          <img src="../../assets/pictures/item.png" alt="Item" class="item-img">
          <div class="info">
            <h3>Item Name</h3>
            <p class="subtext">Restaurant Name</p>
            <div class="quantity-box">
              <button class="qty-btn">-</button>
              <span class="qty-number">1</span>
              <button class="qty-btn">+</button>
            </div>
          </div>
          <span class="price">₱ 164</span>
        </div>
        -->
      </div>

      <!-- Right Side: Order Summary Modal -->
      <div class="order-summary-modal">
        <!-- Order Summary Box -->
        <div class="order-summary-box">
          <h2>ORDER SUMMARY</h2>
          
          <div class="summary-items" id="summaryItemsContainer">
            <!-- Summary rows will be dynamically inserted here -->
            <!-- Example summary row structure:
            <div class="summary-row">
              <span>1x Item Name</span>
              <span>₱ 164</span>
            </div>
            -->
          </div>

          <div class="summary-total">
            <span>Total <span class="delivery-note">(including ₱20 delivery fee)</span></span>
            <span id="totalPrice">₱ 0</span>
          </div>
        </div>

        <!-- Delivery Address Box -->
        <div class="delivery-box">
          <h3>DELIVERY ADDRESS</h3>
          <input type="text" class="delivery-input" id="deliveryAddress" placeholder="Enter your delivery address" required>
        </div>

        <!-- Special Notes Box -->
        <div class="note-box">
          <h3>ADD A NOTE</h3>
          <textarea class="note-field" id="orderNote" placeholder="Any special requests for your order?"></textarea>
        </div>

        <!-- Checkout Button -->
        <button class="checkout-btn" id="checkoutBtn">CHECKOUT</button>
        <!-- Clear Cart Button -->
        <button class="clear-cart-btn" id="clearCartBtn">CLEAR CART</button>
      </div>
    </div>

  </main>

  <!-- Warning Modal -->
  <div id="warningModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 40px 50px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); z-index: 999999; text-align: center; min-width: 380px;">
    <div style="width: 70px; height: 70px; background: #ff9800; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>
    <h2 style="color: #333; margin: 0 0 12px 0; font-size: 22px; font-family: 'Inter', sans-serif; font-weight: 700;">Warning</h2>
    <p id="warningMessage" style="color: #666; margin: 0 0 25px 0; font-size: 16px; font-family: 'Inter', sans-serif; line-height: 1.5;">Please enter a delivery address.</p>
    <button onclick="closeWarningModal()" style="background: #ff9800; color: white; border: none; padding: 12px 40px; border-radius: 25px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; font-family: 'Inter', sans-serif;" onmouseover="this.style.background='#f57c00'" onmouseout="this.style.background='#ff9800'">OK</button>
  </div>

  <!-- Clear Cart Confirmation Modal -->
  <div id="confirmModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999999; justify-content: center; align-items: center;">
    <div style="background: white; border-radius: 20px; padding: 40px 50px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3); max-width: 450px; margin: 20px;">
      <div style="width: 70px; height: 70px; background: #ff9800; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <h2 style="color: #333; margin: 0 0 12px 0; font-size: 24px; font-family: 'Inter', sans-serif; font-weight: 700;">Clear Cart?</h2>
      <p style="color: #666; margin: 0 0 30px 0; font-size: 16px; font-family: 'Inter', sans-serif; line-height: 1.5;">Are you sure you want to clear all items from your cart?</p>
      <div style="display: flex; gap: 12px; justify-content: center;">
        <button onclick="closeConfirmModal()" style="background: #999; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; font-family: 'Inter', sans-serif;" onmouseover="this.style.background='#888'" onmouseout="this.style.background='#999'">Cancel</button>
        <button onclick="confirmClearCart()" style="background: #dc3545; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; font-family: 'Inter', sans-serif;" onmouseover="this.style.background='#c82333'" onmouseout="this.style.background='#dc3545'">Clear Cart</button>
      </div>
    </div>
  </div>

  <!-- Success Modal -->
  <div id="successModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255, 245, 245, 0.98); padding: 40px 50px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.25); z-index: 999999; text-align: center; min-width: 380px; border: 2px solid rgba(139, 0, 0, 0.1);">
    <div style="width: 70px; height: 70px; background: #4CAF50; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
        <path d="M5 13L9 17L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div id="successMessage" style="color: #8B0000; font-size: 19px; font-weight: 700; font-family: 'Inter', sans-serif; line-height: 1.4;">Order placed!<br/>Order ID: 11</div>
  </div>

  <!-- Script -->
  <script src="../../js/user/script.js"></script>
  <script src="../../js/user/customer-cart.js"></script>
</body>
</html>
