<!DOCTYPE html>

<head>

<body>

    <h2>WELCOME BACK TO</h2>

  <div class="right">

    <div class="shape2"></div>

      <button class="signup-btn">LOG IN</button>
      
      <div class="forgot-password">
        <a href="reset.html">Forgot Password?</a>
