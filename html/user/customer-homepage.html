<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Customer Home</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="../../css/user/customer-homepage.css" />
</head>
<body>

  <!-- Navbar -->
  <header class="navbar" role="banner">
    <div class="logo">
      <img src="../../assets/pictures/logo.png" alt="Louver logo" class="logo-img">
      <span>LOUVER</span>
    </div>

    <div class="navbar-right">
      <nav aria-label="Main navigation">
        <a href="customer-homepage.html" class="active">BROWSE</a>
        <a href="myorders.html">MY ORDERS</a>
        <a href="account.html">PROFILE</a>
      </nav>

      <div class="cart" title="Cart" role="button" aria-label="View cart">
        <img src="../../assets/pictures/cart.png" alt="Cart" class="cart-icon">
        <span class="cart-count" aria-live="polite">2</span>
      </div>
    </div>
  </header>

  <main class="container" role="main">
    <div class="top-row">
      <div class="search-and-filters">
        <div class="search-wrapper">
          <input class="search-input" id="restoSearchInput" type="search" placeholder="Search restaurants, cuisines, and dishes" aria-label="Search">
        </div>

        <aside class="sidebar" aria-label="Filters">
          <div class="filters">
            <div class="dropdown-container">
              <button type="button" class="dropdown-button" id="sortDropdown">
                <span>Sort by</span>
                <span class="dropdown-arrow">▼</span>
              </button>
              <div class="dropdown-menu" id="sortMenu">
                <div class="dropdown-item" data-value="relevance">Relevance</div>
                <div class="dropdown-item" data-value="distance">Distance</div>
              </div>
            </div>
          </div>
        </aside>
      </div>

      <div class="page-header">
        <h1>All Restaurants</h1>
      </div>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <div class="content">
      <section class="results" aria-label="Restaurant results">
        <div class="results-grid" id="vendorsContainer"></div>
      </section>
    </div>

  </main>

  <!-- Script -->
  <script src="../../js/user/script.js"></script>
</body>
</html>
