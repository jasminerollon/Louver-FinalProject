<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Louver | Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../css/user/style.css">

</head>
<body>
  <div class="left">
    <h1>LOUVER</h1>
    <p class="tagline">Crave it. Click it. Get it.</p>

    <p class="small">Remember your password?</p>
    <button class="login-btn">BACK TO LOGIN</button>
  </div>

  <div class="right">
    <img src="../../assets/pictures/logo.png" alt="Logo" class="background-logo">
    <div class="shape1"></div>
    <div class="shape2"></div>

    <div class="form-box">
      <h3>RESET YOUR PASSWORD</h3>

      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="New Password" required>
      <input type="password" placeholder="Confirm New Password" required>

      <button class="signup-btn">RESET PASSWORD</button>
    </div>
  </div>

  <!-- Error/Warning Modal Overlay -->
  <div id="errorModalOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999998; align-items: center; justify-content: center;">
    <div style="background: white; padding: 40px 50px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center; min-width: 380px; max-width: 500px; margin: 20px;">
      <div style="width: 70px; height: 70px; background: #ff9800; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <h2 style="color: #333; margin: 0 0 12px 0; font-size: 22px; font-family: 'Poppins', sans-serif; font-weight: 700;">Warning</h2>
      <p id="errorMessage" style="color: #666; margin: 0 0 25px 0; font-size: 16px; font-family: 'Poppins', sans-serif; line-height: 1.5;">Error message</p>
      <button onclick="closeResetErrorModal()" style="background: #ff9800; color: white; border: none; padding: 12px 40px; border-radius: 25px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; font-family: 'Poppins', sans-serif;" onmouseover="this.style.background='#f57c00'" onmouseout="this.style.background='#ff9800'">OK</button>
    </div>
  </div>

  <!-- Success Modal Overlay -->
  <div id="successModalOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999998; align-items: center; justify-content: center;">
    <div style="background: white; padding: 40px 50px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center; min-width: 380px; max-width: 500px; margin: 20px;">
      <div style="width: 80px; height: 80px; background: #28a745; border-radius: 50%; margin: 0 auto 25px; display: flex; align-items: center; justify-content: center;">
        <svg width="45" height="45" viewBox="0 0 24 24" fill="none">
          <path d="M5 13L9 17L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 style="color: #1f1f1f; margin: 0 0 10px 0; font-size: 26px; font-family: 'Poppins', sans-serif; font-weight: 700; letter-spacing: -0.3px;">Password Reset Successful!</h2>
      <p style="color: #6c757d; margin: 0; font-size: 15px; font-family: 'Poppins', sans-serif; font-weight: 400;">Redirecting you to login...</p>
    </div>
  </div>

  <script>
    // Suppress all browser alerts
    window.alert = function() {};
    window.confirm = function() { return true; };
  </script>
  <script src="../../js/user/script.js"></script>
</body>
</html>
