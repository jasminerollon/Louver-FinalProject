<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="../../css/user/home-user.css">
</head>
<body>

<div class="navbar">
    <div class="logo">
        <img src="../assets/pictures/logo.png" alt="Louver Logo" style="height:35px; width:auto;" />
        <span>LOUVER</span>
    </div>

    <div class="navbar-right">
        <nav>
            <a href="#">BROWSE</a>
            <a href="#">MY ORDERS</a>
            <a href="account.html" class="active">PROFILE</a>
        </nav>
        <div class="cart">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-count">3</span>
        </div>
    </div>
</div>

<div class="container">

    <div class="top-row">
        <h1>Reset Password</h1>
        <div class="buttons">
            <button id="save-changes">Save Changes</button>
        </div>
    </div>

    <div class="divider"></div>

    <div class="profile-card edit-profile">
        <div class="profile-picture-wrapper">
            <div class="profile-icon" id="profile-icon">
                <i class="fas fa-user"></i>
            </div>
        </div>

        <div class="info">
            <label for="new-password">NEW PASSWORD</label>
            <input type="password" id="new-password" placeholder="Enter new password">

            <label for="confirm-password">CONFIRM PASSWORD</label>
            <input type="password" id="confirm-password" placeholder="Re-enter new password">
        </div>
    </div>

</div>

<script src="../../js/user/script.js"></script>
</body>
</html>
