<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edit Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="../../css/user/home-user.css">
</head>
<body>

<div class="navbar">
    <div class="logo">
        <img src="../../assets/pictures/logo.png" alt="Louver Logo" style="height:60px; width:auto;" />
        <span>LOUVER</span>
    </div>

    <div class="navbar-right">
        <nav>
            <a href="#">BROWSE</a>
            <a href="#">MY ORDERS</a>
            <a href="account.html" class="active">PROFILE</a>
        </nav>
        <div class="cart" title="Cart" role="button" aria-label="View cart">
            <img src="../../assets/pictures/cart.png" alt="Cart" class="cart-icon">
            <span class="cart-count" aria-live="polite">2</span>
        </div>
    </div>
</div>

<div class="container">
    <form id="editForm" enctype="multipart/form-data">
        <div class="top-row">
            <h1>Edit Profile</h1>
            <div class="buttons">
                <button id="save-changes" type="submit">Save Changes</button>
            </div>
        </div>

        <div class="divider"></div>

        <div class="profile-card edit-profile">

        <div class="profile-picture-wrapper">
            <div class="profile-icon" id="profile-icon">
                <img id="profileImage" src="../../assets/pictures/default.png">
            </div>
            <input type="file" id="upload-input" name="profile_image" style="display: none;" accept="image/*">
            <button class="upload-btn" id="upload-btn">
                <i class="fas fa-upload"></i> Upload
            </button>
    </div>


        <div class="info">
            <label for="name">NAME</label>
            <input type="text" id="name" name="name">

            <label for="email">EMAIL</label>
            <input type="email" id="email" name="email">

            <label for="phone">MOBILE NUMBER</label>
            <input type="text" id="phone" name="phone">
        </div>
    </div> 
</form>

</div>

<script src="../../js/user/script.js"></script>
</body>
</html>
