<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Orders</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="../../css/user/customer-homepage.css" />
</head>
<body>

  <!-- Navbar -->
  <header class="navbar" role="banner">
    <div class="logo">
      <img src="../../assets/pictures/logo.png" alt="Louver logo" class="logo-img">
      <span>LOUVER</span>
    </div>

    <div class="navbar-right">
      <nav aria-label="Main navigation">
        <a href="customer-homepage.html">BROWSE</a>
        <a href="myorders.html" class="active">MY ORDERS</a>
        <a href="account.html">PROFILE</a>
      </nav>

      <div class="cart" title="Cart" role="button" aria-label="View cart">
        <img src="../../assets/pictures/cart.png" alt="Cart" class="cart-icon">
        <span class="cart-count" aria-live="polite">2</span>
      </div>
    </div>
  </header>

  <main class="container" role="main">
    <!-- Search row -->
    <div class="top-row">
      <div class="search-and-filters">
        <div class="search-wrapper">
          <input class="search-input" type="search" placeholder="Search restaurant or order ID" aria-label="Search orders">
        </div>
      </div>

      <div class="page-header">
        <h1>Active Orders</h1>
      </div>
    </div>

  <!-- Active Orders -->
  <section class="orders active-orders">
    <div class="orders-list">
      <p class="no-orders-msg">You have no active orders.</p>
      <!-- JS will inject active order cards here -->
    </div>
  </section>

  <!-- Past Orders -->
  <div class="page-header" style="margin-top:36px;">
    <h1>Past Orders</h1>
  </div>

  <section class="orders past-orders">
    <div class="orders-list past-grid">
      <p class="no-orders-msg">You have no past orders.</p>
    </div>
  </section>

  <!-- Reported Orders -->
<div class="page-header" style="margin-top:36px;">
  <h1>Reported Orders</h1>
</div>

<section class="orders reported-orders">
  <div class="orders-list reported-grid">
    <p class="no-orders-msg">You have no reported orders.</p>
    <!-- JS will inject reported order cards here -->
  </div>
</section>
  </main>

  <!-- Order modal -->
  <div id="order-modal-overlay" class="order-modal-overlay" hidden role="dialog" aria-modal="true" aria-hidden="true">
    <div class="order-modal" role="document" aria-labelledby="modal-title">
      <button class="order-modal-close" aria-label="Close order details">&times;</button>

      <div class="order-modal-body">
        <div class="order-modal-left">
          <h2 id="modal-title">Your Order</h2>
          <h3 class="modal-title" id="modal-restaurant">Restaurant</h3>
          <div class="modal-meta" id="modal-meta"></div>

          <div class="modal-items" id="modal-items">
          </div>

          <div class="modal-total-row">
            <div class="modal-total-label">TOTAL <span class="modal-total-note">(including delivery)</span></div>
            <div class="modal-total-amount" id="modal-total">—</div>
          </div>
          <button class="report-btn">Report an Issue</button>
        </div>
        

        <div class="order-modal-right">
          <div class="status-card">
            <div class="status-title">STATUS</div>
            <div class="status-icon">
              <img src="../../assets/pictures/orderModalCup.png" alt="Order Icon">
            </div>
            <div class="status-text" id="status-text">Preparing your order...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Template for an item row -->
  <template id="order-item-template">
    <div class="modal-item">
      <div class="modal-item-text"></div>
      <div class="modal-item-price"></div>
    </div>
  </template>

  <!-- Script -->
  <script src="../../js/user/script.js"></script>
</body>
</html>
